name: Build Halium Kernel judypn

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev cpio zip
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          mkdir -p out
          
          # Base config & merge halium
          make O=out lineageos_judypn_defconfig
          if [ -f arch/arm64/configs/halium.config ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/halium.config
          fi
          ./scripts/config --file out/.config --disable CONFIG_COMPAT_VDSO
          make O=out olddefconfig

          # Build
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbs

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: judypn-halium-kernel
          path: out/arch/arm64/boot/Image.gz-dtb
