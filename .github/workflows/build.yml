name: Build Halium Kernel judypn

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev cpio zip
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build Kernel
        run: |
          # Export required architecture and toolchain paths
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          mkdir -p out
          
          # 1. Generate base judypn defconfig (with ARCH=arm64)
          make O=out ARCH=arm64 lineageos_judypn_defconfig
          
          # 2. Merge halium.config if present
          if [ -f arch/arm64/configs/halium.config ]; then
            ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/halium.config
          fi
          
          # 3. Disable 32-bit vDSO to prevent runner linker mismatch
          ./scripts/config --file out/.config --disable CONFIG_COMPAT_VDSO
          make O=out ARCH=arm64 olddefconfig

          # 4. Compile kernel and dtbs
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbs

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: judypn-halium-kernel
          path: out/arch/arm64/boot/Image.gz-dtb
